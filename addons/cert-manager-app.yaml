# Apply this AFTER gitops-tkc1 is Provisioned and registered with
# `argocd cluster add <gitops-tkc1-context>`.
# Replace https://192.168.10.14:6443 with the value argocd shows for the
# registered cluster (`argocd cluster list`).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tkc-addons-gitops-tkc1-certmanager
  namespace: demo1
spec:
  project: default
  source:
    repoURL: https://github.com/shanthakumartk/argocd-gitops-tanzu.git
    targetRevision: HEAD
    path: cert-manager
  destination:
    server: https://192.168.10.14:6443
  syncPolicy:
    automated:
      prune: true
